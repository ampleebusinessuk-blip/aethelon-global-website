server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # The proxy in front (Coolify/Traefik) terminates HTTPS; keep redirects relative to it.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Pages: /about/ serves about/index.html; /about redirects to /about/
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Stylesheet, script and data change with each release: revalidate every visit
    location ~* \.(?:css|js|json|xml)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Images, video and fonts rarely change: cache for a week
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|mp4|webm|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Language versions get their own "not found" page
    location ^~ /de/ { try_files $uri $uri/ =404; error_page 404 /de/404.html; add_header Cache-Control "no-cache" always; }
    location ^~ /fr/ { try_files $uri $uri/ =404; error_page 404 /fr/404.html; add_header Cache-Control "no-cache" always; }
    location ^~ /es/ { try_files $uri $uri/ =404; error_page 404 /es/404.html; add_header Cache-Control "no-cache" always; }
    location ^~ /ar/ { try_files $uri $uri/ =404; error_page 404 /ar/404.html; add_header Cache-Control "no-cache" always; }
    location ^~ /hi/ { try_files $uri $uri/ =404; error_page 404 /hi/404.html; add_header Cache-Control "no-cache" always; }

    error_page 404 /404.html;

    # Addresses from the previous version of the site
    location = /about.html            { return 301 /about/; }
    location = /services.html         { return 301 /services/; }
    location = /industries.html       { return 301 /industries/; }
    location = /insights.html         { return 301 /insights/; }
    location = /careers.html          { return 301 /careers/; }
    location = /contact.html          { return 301 /contact/; }
    location = /privacy.html          { return 301 /privacy/; }
    location = /terms.html            { return 301 /terms/; }
    location = /services/cloud-solutions.html     { return 301 /services/cloud-platforms/; }
    location = /services/data-ai.html             { return 301 /services/data-analytics/; }
    location = /services/crm-enterprise-apps.html { return 301 /services/customer-experience/; }
    location = /services/managed-it.html          { return 301 /services/managed-services/; }
    location ~ ^/services/[^/]+\.html$            { return 301 /services/; }
    location ~ ^/blog(/.*)?$                      { return 301 /insights/; }
}
